name: Deploy Vite App to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout source
      uses: actions/checkout@v3

    - name: Setup SSH
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa
        ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

    - name: Deploy via SSH
      run: |
        ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'EOF'

          echo "Connected to EC2 at $(hostname)"

          echo "Installing Docker & Git if not installed..."
          sudo dnf update -y
          sudo dnf install -y docker git

          sudo systemctl start docker
          sudo systemctl enable docker

          echo "Stopping old container if exists..."
          sudo docker stop vite-app || true
          sudo docker rm vite-app || true

          echo "Cloning or pulling repository..."
          if [ ! -d ~/vite-deploy/.git ]; then
            git clone https://github.com/swapnil-shahapurkar/DevOps.git ~/vite-deploy
          fi

          cd ~/vite-deploy
          git pull origin main

          echo "Building Docker image..."
          sudo docker build -t vite-app .

          echo "Running container..."
          sudo docker run -d -p 3000:4173 --name vite-app vite-app

        EOF